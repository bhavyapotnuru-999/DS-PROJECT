<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="mbuNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b38"/>
      <stop offset="100%" stop-color="#143265"/>
    </linearGradient>
    <linearGradient id="mbuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8420"/>
    </linearGradient>
    <linearGradient id="mbuCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b1e2a"/>
      <stop offset="100%" stop-color="#5a1019"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#mbuNavy)" stroke="url(#mbuGold)" stroke-width="4"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="url(#mbuGold)" stroke-width="1.5" stroke-dasharray="2,3"/>

  <!-- Academic Shield Center -->
  <path d="M 80 25 Q 115 32 120 65 Q 120 105 80 128 Q 40 105 40 65 Q 45 32 80 25 Z" fill="#0d2346" stroke="url(#mbuGold)" stroke-width="2.5"/>

  <!-- Open Book of Knowledge -->
  <path d="M 80 82 C 70 76 56 76 48 80 L 48 100 C 56 96 70 96 80 101 C 90 96 104 96 112 100 L 112 80 C 104 76 90 76 80 82 Z" fill="#ffffff" stroke="url(#mbuGold)" stroke-width="1.5"/>
  <line x1="80" y1="82" x2="80" y2="101" stroke="#0d2346" stroke-width="2"/>

  <!-- Torch / Flame of Enlightenment -->
  <path d="M 80 40 C 76 50 72 56 75 64 C 77 70 83 70 85 64 C 88 56 84 50 80 40 Z" fill="url(#mbuGold)"/>
  <path d="M 80 48 C 78 54 76 58 78 62 C 79 65 81 65 82 62 C 84 58 82 54 80 48 Z" fill="#e11d48"/>
  
  <!-- Torch Handle Base -->
  <path d="M 76 66 L 84 66 L 82 74 L 78 74 Z" fill="url(#mbuGold)"/>

  <!-- MBU Letters Inside Shield -->
  <text x="80" y="120" text-anchor="middle" fill="url(#mbuGold)" font-family="system-ui, sans-serif" font-weight="900" font-size="12" letter-spacing="1.5">MBU</text>

  <!-- Curving text or motto -->
  <text x="80" y="148" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="8.5" letter-spacing="0.5">MOHAN BABU UNIVERSITY</text>
  <text x="80" y="18" text-anchor="middle" fill="url(#mbuGold)" font-family="system-ui, sans-serif" font-weight="700" font-size="7.5" letter-spacing="1">VIDYANIKETHAN</text>
</svg>
